<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17332b">
  <title>Administración de accesos — Faro POS Pro</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #202923; background: #f5f5ef; --green: #173f32; --line: #dedfd7; --muted: #68716b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    header { padding: 1.1rem max(1rem, calc((100vw - 920px) / 2)); background: var(--green); color: white; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { width: min(920px, 100%); margin: auto; padding: 1rem; }
    .panel, article { padding: 1rem; border: 1px solid var(--line); border-radius: 14px; background: #fffefa; }
    .panel { max-width: 440px; margin: 2rem auto; }
    label { display: grid; gap: .35rem; margin: .8rem 0; font-weight: 650; }
    input { width: 100%; min-height: 44px; padding: .65rem; border: 1px solid var(--line); border-radius: 9px; font: inherit; }
    button { min-height: 40px; padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #26372f; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    button.primary { border-color: var(--green); background: var(--green); color: white; }
    button.danger { border-color: #e3b3ad; background: #fff0ed; color: #a63c32; }
    .full { width: 100%; min-height: 46px; }
    .muted { color: var(--muted); }
    .message { min-height: 1.5rem; }
    .requests { display: grid; gap: .75rem; margin-top: 1rem; }
    .request-head, .actions { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    .request-head h3 { margin: 0; }
    .actions { justify-content: start; margin-top: .75rem; }
    .status { display: inline-block; padding: .2rem .55rem; border-radius: 99px; background: #edf0ed; font-size: .8rem; font-weight: 700; }
    .status.pending { background: #fff0c8; }
    .status.approved { background: #dff1e5; color: #1f613a; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><h1>Faro POS Pro · Administración de accesos</h1></header>
  <main>
    <section id="login" class="panel" hidden>
      <h2>Acceso de administración</h2>
      <p class="muted">Inicia sesión para revisar las solicitudes y administrar los dispositivos autorizados.</p>
      <form id="login-form">
        <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-message" class="message" role="status"></p>
        <button class="primary full" type="submit">Iniciar sesión</button>
      </form>
    </section>
    <section id="dashboard" hidden>
      <div class="request-head">
        <div><h2>Solicitudes de acceso</h2><p id="admin-label" class="muted"></p></div>
        <div class="actions">
          <button id="refresh" type="button">Actualizar solicitudes</button>
          <button id="sign-out" type="button">Cerrar sesión</button>
        </div>
      </div>
      <p id="dashboard-message" class="message" role="status"></p>
      <div id="requests" class="requests"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    "use strict";
    const SUPABASE_URL = "https://mkirhamxvvdhmnrkozwg.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_zszFg_20dthjs3Ai1p8H4w_RSy2FluG";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const loginSection = document.getElementById("login");
    const dashboard = document.getElementById("dashboard");
    const loginMessage = document.getElementById("login-message");
    const dashboardMessage = document.getElementById("dashboard-message");
    const requestsRoot = document.getElementById("requests");
    let currentUser = null;
    let refreshTimer = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }
    function roleLabel(role) {
      return ({ mesero: "Servicio", cocina: "Cocina", caja: "Caja" })[role] ?? role;
    }
    function formatDate(value) {
      return new Intl.DateTimeFormat("es-MX", {
        dateStyle: "medium", timeStyle: "short", timeZone: "America/Monterrey"
      }).format(new Date(value));
    }
    function showLogin(message = "") {
      window.clearInterval(refreshTimer);
      dashboard.hidden = true;
      loginSection.hidden = false;
      loginMessage.textContent = message;
    }
    async function requireAdmin(user) {
      const { data, error } = await supabaseClient.from("staff_roles")
        .select("role").eq("user_id", user.id).maybeSingle();
      if (error) throw error;
      if (data?.role !== "admin") {
        const { error: signOutError } = await supabaseClient.auth.signOut();
        if (signOutError) console.error("No se pudo cerrar la sesión sin rol administrador.", signOutError);
        throw new Error("Esta cuenta no tiene permisos de administración.");
      }
      currentUser = user;
      loginSection.hidden = true;
      dashboard.hidden = false;
      document.getElementById("admin-label").textContent = `Sesión iniciada: ${user.email}`;
      await loadRequests();
      window.clearInterval(refreshTimer);
      refreshTimer = window.setInterval(() => { void loadRequests(); }, 15000);
    }
    async function loadRequests() {
      if (!currentUser) return;
      dashboardMessage.textContent = "Consultando solicitudes…";
      const { data, error } = await supabaseClient.rpc("listar_solicitudes_puesto");
      if (error) {
        console.error("No se pudieron cargar las solicitudes.", error);
        dashboardMessage.textContent = "No se pudieron consultar las solicitudes. Inténtalo de nuevo.";
        return;
      }
      requestsRoot.innerHTML = data.length ? data.map((request) => {
        const statusLabel = {
          pending: "Pendiente", approved: "Aprobado", rejected: "Rechazado", revoked: "Revocado"
        }[request.status] ?? request.status;
        let controls = "";
        if (request.status === "pending") {
          controls = `<div class="actions">
            <button class="primary" type="button" data-approve="${escapeHtml(request.user_id)}">Autorizar dispositivo</button>
            <button class="danger" type="button" data-reject="${escapeHtml(request.user_id)}">Rechazar solicitud</button>
          </div>`;
        } else if (request.status === "approved") {
          controls = `<div class="actions"><button class="danger" type="button" data-revoke="${escapeHtml(request.user_id)}">Retirar acceso</button></div>`;
        } else {
          controls = `<div class="actions"><button class="primary" type="button" data-reactivate="${escapeHtml(request.user_id)}">Autorizar nuevamente</button></div>`;
        }
        return `<article>
          <div class="request-head">
            <h3>${escapeHtml(request.device_label)}</h3>
            <span class="status ${escapeHtml(request.status)}">${escapeHtml(statusLabel)}</span>
          </div>
          <p><strong>Área solicitada:</strong> ${escapeHtml(roleLabel(request.requested_role))}</p>
          <p><strong>Fecha de solicitud:</strong> ${escapeHtml(formatDate(request.requested_at))}</p>
          <p class="muted"><strong>Identificador del dispositivo:</strong> ${escapeHtml(request.user_id)}</p>
          ${controls}
        </article>`;
      }).join("") : `<article class="muted">Aún no hay solicitudes de acceso.</article>`;
      dashboardMessage.textContent = `Solicitudes actualizadas ${formatDate(new Date().toISOString())}. Verifica el nombre y el área antes de autorizar cada dispositivo.`;
    }
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector("button[type=submit]");
      button.disabled = true;
      loginMessage.textContent = "Verificando acceso…";
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: form.elements.email.value.trim(),
          password: form.elements.password.value
        });
        if (error) throw error;
        await requireAdmin(data.user);
      } catch (error) {
        console.error("No se pudo iniciar sesión como administrador.", error);
        loginMessage.textContent = error.message === "Esta cuenta no tiene permisos de administración."
          ? error.message
          : "No se pudo iniciar sesión. Verifica el correo y la contraseña e inténtalo de nuevo.";
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById("requests").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-approve], button[data-reject], button[data-revoke], button[data-reactivate]");
      if (!button) return;
      button.disabled = true;
      dashboardMessage.textContent = "Guardando cambios…";
      try {
        if (button.dataset.approve || button.dataset.reject || button.dataset.reactivate) {
          const approve = Boolean(button.dataset.approve || button.dataset.reactivate);
          const userId = button.dataset.approve || button.dataset.reject || button.dataset.reactivate;
          const confirmation = button.dataset.reactivate
            ? "¿Quieres volver a autorizar este dispositivo para el área asignada?"
            : approve
              ? "¿Autorizas este dispositivo para el área solicitada?"
              : "¿Quieres rechazar esta solicitud? El dispositivo no tendrá acceso al sistema.";
          if (!window.confirm(confirmation)) return;
          const { error } = await supabaseClient.rpc("resolver_solicitud_puesto", {
            p_user_id: userId,
            p_approve: approve
          });
          if (error) throw error;
        } else {
          if (!window.confirm("¿Quieres retirar el acceso de este dispositivo? Ya no podrá consultar información ni realizar operaciones.")) return;
          const { error } = await supabaseClient.rpc("revocar_acceso_puesto", {
            p_user_id: button.dataset.revoke
          });
          if (error) throw error;
        }
        await loadRequests();
      } catch (error) {
        console.error("No se pudo actualizar el acceso del aparato.", error);
        dashboardMessage.textContent = "No se pudieron guardar los cambios. Inténtalo de nuevo.";
      } finally {
        button.disabled = false;
      }
    });
    document.getElementById("refresh").addEventListener("click", () => { void loadRequests(); });
    document.getElementById("sign-out").addEventListener("click", async () => {
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        console.error("No se pudo cerrar sesión.", error);
        dashboardMessage.textContent = "No se pudo cerrar la sesión. Inténtalo de nuevo.";
        return;
      }
      currentUser = null;
      showLogin("Sesión cerrada.");
    });

    (async () => {
      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) throw error;
        if (data.session) await requireAdmin(data.session.user);
        else showLogin();
      } catch (error) {
        console.error("No se pudo iniciar el panel de aprobación.", error);
        showLogin(error.message === "Esta cuenta no tiene permisos de administración."
          ? error.message
          : "No se pudo verificar el acceso. Revisa tu conexión e inténtalo de nuevo.");
      }
    })();
  </script>
</body>
</html>
